name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 安装依赖
        run: npm ci
      - name: 运行测试
        run: npm test

  release-gate:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'pull_request'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 运行门禁脚本单元测试
        run: node --test .github/scripts/release-gate-check.test.mjs
      - name: 核验 PR 上线三件套
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/release-gate-check.mjs --pr ${{ github.event.pull_request.number }}
